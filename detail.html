<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="assets/style.css"><script src="assets/data.js"></script><script src="assets/policy.js"></script><script src="assets/purchase.js"></script><script src="assets/common.js"></script><title>세션 상세 — 플래닛피플</title></head><body>
<main><div class="wrap detail-top"><div><div class="detail-thumb" id="d-thumb"></div>
<div class="notice"><b>서비스 제공 방식</b><br>실물 배송이 없는 오프라인 모임 참여 서비스입니다. 결제 승인이 완료되면 참여 신청이 접수됩니다. 모임 진행 확정은 모집 결과에 따라 별도로 안내합니다. 최종적으로 모임이 취소되면 해당 결제분을 전액 환불합니다.</div></div>
<div><span class="tag" id="d-tag"></span><h1 id="d-title"></h1>
<p id="d-price" class="price"></p><p id="d-schedule"></p><p id="d-people"></p>
<table class="info-table" id="d-details"></table><p id="d-desc"></p>
<div class="notice"><b>취소·환불 안내</b><p id="refund-summary"></p><a href="refund.html">정책 및 예외 기준 확인</a></div>
<p>개별 결제일부터 해당 결제분 최종 모임 종료까지 최대 70일 이내에 제공합니다. 자동 정기결제는 없습니다.</p>
<p id="sale-status" role="status"></p><a class="btn block" id="d-buy" href="sessions.html">세션 목록으로</a></div></div></main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const s=getSession();
  if(!s){document.getElementById('d-title').textContent='존재하지 않는 상품입니다';return;}
  document.title=s.title+' — 플래닛피플';
  document.getElementById('d-thumb').innerHTML=svgArt(s,280);
  for(const key of ['tag','title','desc','people']) document.getElementById('d-'+key).textContent=s[key];
  document.getElementById('d-price').textContent=won(s.price)+' / '+s.purchaseScope;
  document.getElementById('d-schedule').textContent=scheduleText(s);
  document.getElementById('refund-summary').textContent=POLICY.summary;
  renderPurchaseInfo('d-details',s);
  const open=saleLabel(s)==='신청 가능';
  document.getElementById('sale-status').textContent=saleLabel(s)+' · 비회원 이용 가능';
  const buy=document.getElementById('d-buy');
  buy.textContent=open?'참여 신청하고 결제하기':'신청 기간 확인';
  buy.href='checkout.html?id='+encodeURIComponent(s.id);
});
</script></body></html>

<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="assets/style.css"><script src="assets/data.js"></script><script src="assets/common.js"></script><title>결제 실패 — 프롬더허들</title></head>
<body>
<main class="result">
  <div class="icon">⚠️</div>
  <h2>결제가 완료되지 않았습니다</h2>
  <p style="color:var(--ink-soft);font-size:14.5px;margin-top:10px" id="fmsg">결제 진행 중 문제가 발생했습니다. 다시 시도해 주세요.</p>
  <a class="btn" href="sessions.html" style="margin-top:24px">세션 목록으로 돌아가기</a>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const m = new URLSearchParams(location.search).get("message");
  if (m) document.getElementById("fmsg").textContent = m + " 다시 시도해 주세요.";
});
</script>
</body></html>

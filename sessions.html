<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="assets/style.css"><script src="assets/data.js"></script><script src="assets/common.js"></script><title>세션 둘러보기 — 플래닛피플</title></head>
<body>
<main>
  <section><div class="wrap">
    <h2>세션 둘러보기</h2>
    <p class="sub">오프라인 세션을 소개합니다. 판매 준비 중인 상품은 일정 확정 후 신청이 열립니다. 모든 세션은 비회원도 신청·결제할 수 있습니다.</p>
    <div class="grid" id="list-grid"></div>
  </div></section>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("list-grid").innerHTML = SESSIONS.map(s=>`
    <a class="card" href="detail.html?id=${s.id}">
      ${svgArt(s,150)}
      <div class="card-body">
        <span class="tag">${s.tag}</span>
        <h3>${s.title}</h3>
        <div class="meta">${s.place.split("(")[0]}<br>${scheduleText(s)} · ${s.people}</div>
        <div class="price">${won(s.price)} <small>/ 1회 참여 · ${s.saleStatus === "open" ? "모집 중" : "판매 준비 중"}</small></div>
      </div>
    </a>`).join("");
});
</script>
</body></html>

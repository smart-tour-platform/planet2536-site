[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Public payment settings may appear in source. Keep credentials and encryption keys scanned.
  SECRETS_SCAN_OMIT_KEYS = "TOSS_MODE,TOSS_MID,TOSS_TEST_MID,TOSS_TAX_MODE,TOSS_PAYMENT_VARIANT,TOSS_AGREEMENT_VARIANT,PAYMENTS_ENABLED"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/success.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

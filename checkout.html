<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="assets/style.css"><script src="assets/data.js"></script><script src="assets/common.js"></script><title>참여 신청 · 결제 — 플래닛피플</title>
<script src="https://js.tosspayments.com/v2/standard"></script></head>
<body>
<main class="checkout">
  <h2 style="margin-bottom:24px">참여 신청 · 결제</h2>

  <div class="box">
    <h3>주문 내용</h3>
    <div class="row"><span id="o-title"></span><span id="o-price" style="font-weight:700"></span></div>
    <div class="row"><span style="color:var(--ink-soft)">일정</span><span id="o-schedule" style="font-size:13.5px"></span></div>
    <div class="row total"><span>총 결제금액</span><span id="o-total" style="color:var(--amber)"></span></div>
  </div>

  <div class="box">
    <h3>신청자 정보 <span style="font-weight:500;font-size:12.5px;color:var(--ink-soft)">— 비회원 신청 가능</span></h3>
    <div class="field"><label for="f-name">이름</label><input id="f-name" placeholder="이름을 입력하세요" autocomplete="name"></div>
    <div class="field"><label for="f-phone">휴대폰 번호</label><input id="f-phone" placeholder="010-0000-0000" autocomplete="tel"></div>
    <div class="field"><label for="f-email">이메일</label><input id="f-email" placeholder="example@email.com" autocomplete="email"></div>
  </div>

  <div class="box">
    <h3>결제 수단</h3>
    <div id="payment-method"></div>
    <div id="agreement"></div>
  </div>

  <div class="box" style="background:var(--bg-tint);border:none">
    <label class="agree"><input type="checkbox" id="agree-refund">
      <span><b>취소·환불 규정에 동의합니다.</b> 이용일 기준 10일 전까지 전액 환불되며, 이후 취소 시점에 따라 일별 차등 위약금이 차감됩니다. 이용일이 임박한 경우 「전자상거래법」 제17조 제2항에 따라 청약철회가 제한될 수 있습니다. <a href="refund.html" target="_blank" style="color:var(--pine);font-weight:600">전체 규정 보기</a></span>
    </label>
    <label class="agree"><input type="checkbox" id="agree-once">
      <span>본 결제는 1회성 결제이며, <b>다음 결제는 자동으로 이루어지지 않습니다.</b></span>
    </label>
  </div>

  <button class="btn block" id="pay-btn" disabled>결제하기</button>
</main>
<script src="assets/checkout.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="assets/style.css"><script src="assets/data.js"></script><script src="assets/policy.js"></script><script src="assets/purchase.js"></script><script src="assets/common.js"></script><title>참여 신청 · 결제 — 플래닛피플</title></head><body>
<main class="checkout"><h2>참여 신청 · 결제</h2>
<div class="box"><h3>주문 내용</h3><p class="tag" id="o-participation"></p><div class="row"><span id="o-title"></span><span id="o-price"></span></div>
<div class="notice"><b>이번 결제에 포함되는 모임</b><p id="payment-scope"></p></div>
<div class="row"><span>일정</span><span id="o-schedule"></span></div><table class="info-table" id="o-details"></table>
<div class="row total"><span>총 결제금액</span><span id="o-total"></span></div>
<p>개별 결제일부터 해당 결제분 최종 모임 종료까지 최대 70일. 참여 신청 완료와 모임 진행 확정은 구분됩니다.</p></div>
<div class="box"><h3>신청자 정보 — 비회원 신청 가능</h3>
<div class="field"><label for="f-name">이름 (필수)</label><input id="f-name" required maxlength="60" autocomplete="name"></div>
<div class="field"><label for="f-phone">휴대폰 번호 (필수)</label><input id="f-phone" required type="tel" maxlength="15" pattern="01[016789][- ]?[0-9]{3,4}[- ]?[0-9]{4}" placeholder="010-0000-0000" autocomplete="tel"></div>
<div class="field"><label for="f-email">이메일 (선택)</label><input id="f-email" type="email" maxlength="254" autocomplete="email"></div></div>
<div class="box"><h3>결제 수단</h3><div id="payment-method"></div><div id="agreement"></div>
<fieldset id="payment-window-methods" hidden disabled><legend>결제 방법 선택</legend>
<label><input type="radio" name="payment-method" value="CARD" checked> 신용·체크카드 / 간편결제</label>
<label><input type="radio" name="payment-method" value="TRANSFER"> 계좌이체</label>
<p>결제하기를 누르면 토스페이먼츠 결제창에서 결제 정보와 약관을 확인합니다.</p></fieldset></div>
<div class="box"><p id="refund-summary"></p>
<label class="agree"><input type="checkbox" id="agree-refund"><span>[필수] <a href="refund.html" target="_blank" rel="noopener">취소·환불정책과 예외 기준</a>을 확인하고 동의합니다.</span></label>
<label class="agree"><input type="checkbox" id="agree-terms"><span>[필수] <a href="terms.html" target="_blank" rel="noopener">이용약관</a>에 동의합니다.</span></label>
<label class="agree"><input type="checkbox" id="agree-privacy"><span>[필수] 이름·휴대폰 번호, 입력한 경우 이메일을 신청 접수·연락·결제·환불에 이용하는 것에 동의합니다. 거래 기록은 법정 기간(계약·결제 5년) 보관하며 미결제 주문은 30일 이내 파기합니다. 동의를 거부할 수 있으나 신청이 제한됩니다. 이메일은 입력하지 않아도 됩니다. <a href="privacy.html" target="_blank" rel="noopener">개인정보 안내</a></span></label>
<label class="agree"><input type="checkbox" id="agree-once"><span id="agree-once-text">[필수] 본 결제는 표시된 모임에 대한 1회성 결제이며 자동으로 갱신·재결제되지 않습니다.</span></label></div>
<p id="checkout-status" role="status" aria-live="polite">결제 가능 여부 확인 중</p><button class="btn block" id="pay-btn" disabled>결제하기</button></main><script src="https://js.tosspayments.com/v2/standard"></script><script src="assets/checkout.js"></script></body></html>
